services:
  caddy:
    image: caddy:2-alpine
    container_name: jobtracker-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  backend:
    container_name: jobtracker-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${DATABASE_NAME}?authSource=admin
      - DATABASE_NAME=${DATABASE_NAME}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - DOMAIN=${DOMAIN:-localhost}
      - INVITATION_CODE=${INVITATION_CODE:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN:-localhost},http://${DOMAIN:-localhost}}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FRANCE_TRAVAIL_CLIENT_ID=${FRANCE_TRAVAIL_CLIENT_ID:-}
      - FRANCE_TRAVAIL_CLIENT_SECRET=${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      - SUMMARY_MODEL=${SUMMARY_MODEL:-gpt-5-nano}
      - CRAWL_LLM_MODEL=${CRAWL_LLM_MODEL:-openai/gpt-4o-mini}
      - CREW_LLM_MODEL=${CREW_LLM_MODEL:-gpt-5.6-luna}
      - EVALUATION_MODEL=${EVALUATION_MODEL:-gemini/gemini-3.8-flash}
      - EVALUATION_FALLBACK_MODEL=${EVALUATION_FALLBACK_MODEL:-gemini/gemini-3.8-flash}
      - CV_TAILOR_MODEL=${CV_TAILOR_MODEL:-gemini/gemini-3.8-flash}
      - LETTER_MODEL_ANALYST=${LETTER_MODEL_ANALYST:-gemini/gemini-3.8-flash}
      - LETTER_MODEL_WRITER=${LETTER_MODEL_WRITER:-openai/gpt-5.6-terra}
      - LETTER_MODEL_CRITIC=${LETTER_MODEL_CRITIC:-gemini/gemini-3.8-flash}
      - LETTER_MODEL_REVISER=${LETTER_MODEL_REVISER:-openai/gpt-5.6-terra}
      - INTERVIEW_PREP_MODEL=${INTERVIEW_PREP_MODEL:-${EVALUATION_MODEL:-gemini/gemini-3.8-flash}}
      - ROLE_SUGGESTION_MODEL=${ROLE_SUGGESTION_MODEL:-openai/gpt-4o-mini}
      - PATH=/app/.venv/bin:$PATH
      - UV_CACHE_DIR=/app/.cache/uv
      - UV_LINK_MODE=copy
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: jobtracker-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${DATABASE_NAME}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  frontend:
    container_name: jobtracker-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["npm", "run", "start"]
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://${DOMAIN:-localhost}/api}
      - INTERNAL_API_URL=http://backend:8000
      - HOSTNAME=0.0.0.0
      - PORT=3875
    depends_on:
      - backend
    networks:
      - app-network

  airflow:
    container_name: jobtracker-airflow
    build:
      context: ./backend
      dockerfile: Dockerfile.airflow
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./airflow/dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
      - airflow_logs:/opt/airflow/logs
      - /app/.venv
    environment:
      - TZ=Europe/Paris
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__TASK_HEARTBEAT_TIMEOUT=900
      - AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT=900
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=300
      - AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL=60
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-change_me_super_secret_key}
      - AIRFLOW__CORE__PARALLELISM=2
      - AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG=1
      - AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG=1
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__WEBSERVER__WORKER_TIMEOUT=300
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb
      - DATABASE_NAME=${DATABASE_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FRANCE_TRAVAIL_CLIENT_ID=${FRANCE_TRAVAIL_CLIENT_ID:-}
      - FRANCE_TRAVAIL_CLIENT_SECRET=${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      - SUMMARY_MODEL=${SUMMARY_MODEL:-gpt-5-nano}
      - CRAWL_LLM_MODEL=${CRAWL_LLM_MODEL:-openai/gpt-4o-mini}
      - CREW_LLM_MODEL=${CREW_LLM_MODEL:-gpt-5.6-luna}
      - PATH=/root/.local/bin:/app/.venv/bin:$PATH
      - DISPLAY=:99
    deploy:
      resources:
        limits:
          memory: 3.5G
          cpus: '2.5'
        reservations:
          memory: 1.5G
          cpus: '1.0'
    command: >
      bash -c "
      echo 'Démarrage Airflow...' &&
      mkdir -p /opt/airflow/logs &&
      chmod -R 777 /opt/airflow &&
      Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
      airflow standalone
      "
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongodb_data:
  airflow_data:
  airflow_logs:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
