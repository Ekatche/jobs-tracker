# backend/setup.cfg
[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
select = C,E,F,W,B950
exclude = 
    .git,
    __pycache__,
    docs/source/conf.py,
    old,
    build,
    dist,
    .venv,
    venv,
    env,
    */migrations/*
per-file-ignores = 
    tests/*: F401,E302,E303,E306,W391,F841
    backend/tests/*: F401,E302,E303,E306,W391,F841