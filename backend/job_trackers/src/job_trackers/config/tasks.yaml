convert_query_task:
  description: >
    Analyse la demande utilisateur suivante : '{user_query}'
    
    1. Identifie l'intitulé de poste clé (ex: 'Data Scientist', 'Développeur Fullstack').
    2. Identifie la localisation géographique (ex: 'Lyon', 'Paris', 'Télétravail').
    3. Détecte le type de contrat si spécifié (ex: 'CDI', 'Freelance', 'Stage', 'Alternance').
    4. Formule une requête principale percutante et optimisée pour les job boards (ex: 'offres emploi Data Scientist Lyon CDI').
    5. Propose 2 variantes de requêtes ciblées (ex: 'recrutement Data Scientist Lyon', 'offres emploi "Data Science" Auvergne-Rhône-Alpes').

  expected_output: >
    Un objet structuré conforme au schéma OptimizedQueries contenant la requête principale, les alternatives et les entités extraites.
  agent: query_converter
  input_variables:
    user_query: ${inputs.user_query}

execute_search_task:
  description: >
    À partir de la requête optimisée générée par la tâche précédente, utilise l'outil "Recherche d'offres d'emploi sur job boards".
    
    Passe la requête principale sous forme de chaîne de caractères simple à l'outil pour interroger les job boards et LinkedIn.
    Récupère l'ensemble des URLs brutes retournées par la recherche.

  expected_output: >
    Une liste d'URLs d'offres d'emploi issues des résultats de recherche.
  agent: search_executor
  input_variables:
    query: ${convert_query_task.output}

filter_urls_task:
  description: >
    Examine attentivement l'ensemble des URLs collectées par la tâche de recherche et sélectionne UNIQUEMENT les liens les plus qualifiés, fiables et pertinents.
    
    Règles de qualification et de sélection :
    1. **Priorité absolue aux offres directes d'entreprises et fiches individuelles (Top Score 9-10)** :
       - **Portails carrières et ATS directs d'entreprises** :
         * Greenhouse : boards.greenhouse.io/<entreprise>/jobs/<id>
         * Lever : jobs.lever.co/<entreprise>/<id>
         * Workable : apply.workable.com/<entreprise>/j/<id>
         * Ashby : jobs.ashbyhq.com/<entreprise>/<id>
         * Teamtailor : *.teamtailor.com/jobs/<id>
         * Recruitee : *.recruitee.com/o/<id>
         * Personio : *.personio.de/job/<id> ou *.personio.com/job/<id>
         * Workday : *.myworkdayjobs.com/.../job/...
       - **Fiches directes des job boards qualifiés** :
         * Welcome to the Jungle : welcometothejungle.com/fr/companies/<entreprise>/jobs/<slug>
         * HelloWork : hellowork.com/fr-fr/emplois/<id>.html
         * APEC : apec.fr/candidat/recherche-emploi.html/offre/<id>
         * France Travail : candidat.francetravail.fr/offres/recherche/detail/<id>
         * Cadremploi : cadremploi.fr/emploi/detail_offre/<id>
         * LinkedIn : linkedin.com/jobs/view/<id>

    2. **Adéquation poste & zone géographique** :
       - Vérifie que l'intitulé ou le chemin de l'URL concorde avec le métier recherché et la localisation demandée.

    3. **Exclusions obligatoires** :
       - Exclure les pages de connexion, formulaires de candidature génériques, flux RSS ou blogs.
       - Exclure les agrégateurs spam (Jooble, Neuvoo, Talent.com, Jobrapido, OptionCarriere, Adzuna).
       - Exclure toute page de résultats (listing ou recherche) dont le slug métier dans le chemin de l'URL ne correspond pas au poste recherché, même si le domaine ou d'autres mots-clés de la requête semblent concorder. Contre-exemple réel : pour une requête "ingénieur MLOps proche de Lyon", l'URL candidat.francetravail.fr/offres/emploi/ingenieur-structures/lyon/... a été retenue à tort — elle pointe vers le métier "ingénieur structures" (structures métalliques, génie civil), qui n'a aucun rapport avec MLOps, malgré la présence de "ingénieur" et "lyon" dans l'URL et la requête.
       - Éliminer tous les doublons d'URL.
    
    4. **Sélection finale** :
       - Retenir entre 8 et 15 URLs optimales en privilégiant une saine diversité entre les carrières directes d'entreprises (ATS) et les grands job boards nationaux.
       - Attribuer à chaque URL une note de pertinence (1 à 10) et la plateforme source identifiée (ex: "Greenhouse", "Lever", "Workable", "Ashby", "HelloWork", "Welcome to the Jungle", "Apec", "France Travail", "LinkedIn").

  expected_output: >
    Un objet structuré conforme au schéma FilteredJobOffersResult listant les URLs finales retenues et le détail de chaque offre qualifiée.
  agent: url_filter
  input_variables:
    urls: ${execute_search_task.output}
    original_query: ${convert_query_task.output}
